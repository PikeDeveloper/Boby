name: boby
description: "A new Flutter project."
publish_to: 'none'
version: 4.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  just_audio: ^0.9.36
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#6bdeff"
  image: assets/splash_screen.png
  android: true
  ios: true
  android_12:
    color: "#6bdeff"
    image: assets/splash_screen.png

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/
    - assets/sounds/
    - assets/backgrounds/
    - assets/icon/
    - assets/letters/
    - assets/shapes/
    - assets/numbers/
    - assets/letters_2/
    - assets/sound_names/
    - assets/backgrounds/
